name: Clean Old Output

on:
  schedule:
    # 每天早上 7:30 运行一次 (北京时间 UTC+8，对应 UTC 时间前一天 23:30)
    # 在爬虫任务 (23:00) 之后执行清理
    - cron: "30 23 * * *"
  workflow_dispatch: # 允许手动触发

# 添加权限设置，允许推送代码
permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Run cleanup script
        run: python clean_output.py

      - name: Commit and push if changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: clean up output older than 1 week at $(TZ=Asia/Shanghai date)" && git push)
